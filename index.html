<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportTips AI – Download</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HG6B5C7GJS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HG6B5C7GJS');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .sub  { color: #888; font-size: 0.95rem; margin-bottom: 32px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-msg { color: #888; font-size: 0.85rem; }
    .fallback { display: none; margin-top: 32px; }
    .fallback.visible { display: block; }
    .fallback-hint {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 280px;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      margin: 8px auto;
    }
    .btn-ios     { background: #007aff; color: #fff; }
    .btn-android { background: #3ddc84; color: #000; }
    .btn-web     { background: #333;    color: #fff; }
  </style>
</head>
<body>

  <div class="logo">⚽ SportTips AI</div>
  <div class="sub">AI-powered football predictions</div>

  <div class="spinner" id="spinner"></div>
  <div class="redirect-msg" id="msg">Detecting your device…</div>

  <div class="fallback" id="fallback">
    <p class="fallback-hint" id="fallback-hint">Choose your platform:</p>
    <a class="btn btn-ios"     href="https://apps.apple.com/gr/app/sporttips-ai/id6763242331"
       onclick="gtag('event','download_tap',{event_category:'platform',event_label:'ios'})">Download on App Store</a>
    <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.sporttipsai.app"
       onclick="gtag('event','download_tap',{event_category:'platform',event_label:'android'})">Get it on Google Play</a>
    <a class="btn btn-web"     href="https://sites.google.com/view/sporttips-ai/"
       onclick="gtag('event','download_tap',{event_category:'platform',event_label:'web'})">Open Website</a>
  </div>

  <script>
    var IOS_URL     = "https://apps.apple.com/gr/app/sporttips-ai/id6763242331";
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.sporttipsai.app";
    var WEB_URL     = "https://sites.google.com/view/sporttips-ai/";

    function detect() {
      var ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
      if (/Android/i.test(ua))          return "android";
      return "web";
    }

    // Social media in-app browsers block JS redirects — detect them up front
    function isInAppBrowser() {
      var ua = navigator.userAgent || "";
      return /Instagram|FBAN|FBAV|BytedanceWebview|musical_ly|TikTok|Twitter|Snapchat/i.test(ua);
    }

    function showButtons(hint) {
      document.getElementById("spinner").style.display  = "none";
      document.getElementById("msg").style.display      = "none";
      if (hint) document.getElementById("fallback-hint").textContent = hint;
      document.getElementById("fallback").classList.add("visible");
    }

    function redirect() {
      // In-app browsers (Instagram, Facebook, TikTok…) block window.location.replace().
      // Skip the redirect entirely and go straight to the tap-to-download buttons.
      if (isInAppBrowser()) {
        gtag('event', 'inapp_browser', { event_category: 'platform', event_label: detect() });
        showButtons("Tap below to download:");
        return;
      }

      var platform = detect();
      var targets  = { ios: IOS_URL, android: ANDROID_URL, web: WEB_URL };
      var labels   = { ios: "App Store", android: "Google Play", web: "website" };
      var url      = targets[platform];

      document.getElementById("msg").textContent = "Redirecting you to " + labels[platform] + "…";

      gtag('event', 'redirect', { event_category: 'platform', event_label: platform });
      setTimeout(function() { window.location.replace(url); }, 300);

      // Safety net: if replace() is somehow blocked, show buttons after 2s
      setTimeout(function() { showButtons("Choose your platform:"); }, 2000);
    }

    redirect();
  </script>

</body>
</html>
