<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:#07090D;
  color:#EEF2F7;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 100% 50% at 50% -5%,rgba(74,222,128,.11) 0%,transparent 65%);
  pointer-events:none;
  z-index:0;
}

.back{
  position:fixed;
  top:16px;left:20px;
  z-index:10;
  font-size:.8rem;
  color:#3A4A58;
  text-decoration:none;
  transition:color .15s;
}
.back:hover{color:#5C7080}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.app-icon{
  width:96px;height:96px;
  border-radius:24px;
  background:linear-gradient(145deg,#14201A 0%,#0C1510 100%);
  border:1.5px solid rgba(74,222,128,.18);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 48px rgba(74,222,128,.07),0 8px 32px rgba(0,0,0,.5);
}
.app-icon svg{width:52px;height:52px}

.app-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:3.25rem;font-weight:800;
  letter-spacing:-.01em;line-height:1;
  text-wrap:balance;
  margin-bottom:10px;color:#EEF2F7;
}
.app-name .accent{color:#4ADE80}

.tagline{
  font-size:.95rem;color:#5C6E82;
  font-weight:400;line-height:1.5;
  margin-bottom:28px;max-width:28ch;
}

.stats{
  display:flex;gap:6px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin-bottom:44px;
}
.chip{
  font-size:.72rem;font-weight:500;
  color:#4A5E72;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:99px;padding:5px 11px;
  white-space:nowrap;letter-spacing:.01em;
}

.btn-group{display:flex;flex-direction:column;gap:12px;width:100%}

.store-btn{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;padding:18px 24px;border-radius:16px;
  text-decoration:none;font-family:'DM Sans',sans-serif;
  transition:transform .13s ease,box-shadow .13s ease;
  cursor:pointer;border:none;
}
.store-btn:hover{transform:translateY(-2px)}
.store-btn:active{transform:translateY(0)}
.store-btn:focus-visible{outline:2px solid #4ADE80;outline-offset:3px}

.btn-ios{
  background:#FFFFFF;color:#07090D;
  box-shadow:0 2px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);
}
.btn-ios:hover{box-shadow:0 6px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.12)}

.btn-android{
  background:#101620;color:#EEF2F7;
  border:1.5px solid rgba(255,255,255,.09);
  box-shadow:0 2px 24px rgba(0,0,0,.4);
}
.btn-android:hover{background:#141B28;box-shadow:0 6px 32px rgba(0,0,0,.5)}

.btn-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn-sub{font-size:.68rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
.btn-main{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}

.footer{margin-top:44px;font-size:.72rem;color:#2E3B48;line-height:1.6}
.footer a{color:#3D5060;text-decoration:none}
.footer a:hover{color:#5C7080}
.footer .dot{display:inline-block;margin:0 6px}

@media(prefers-reduced-motion:reduce){.store-btn{transition:none}}
</style>
