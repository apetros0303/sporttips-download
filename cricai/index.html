<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CricAI</title>
<meta name="description" content="AI-powered cricket match predictions, live updates and insights. Free on iOS and Android.">
<link rel="canonical" href="https://petransw.com/cricai/">
<meta property="og:title" content="CricAI — AI Cricket Predictions">
<meta property="og:description" content="AI-powered cricket match predictions and live updates for IPL, T20 World Cup and international fixtures.">
<meta property="og:url" content="https://petransw.com/cricai/">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:#060C14;
  color:#EEF4FF;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 100% 50% at 50% -5%,rgba(56,189,248,.1) 0%,transparent 65%);
  pointer-events:none;
  z-index:0;
}

.back{
  position:fixed;
  top:16px;left:20px;
  z-index:10;
  font-size:.8rem;
  color:#2E3E50;
  text-decoration:none;
  transition:color .15s;
}
.back:hover{color:#4A6070}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.app-icon{
  width:96px;height:96px;
  border-radius:24px;
  background:linear-gradient(145deg,#0A1826 0%,#061020 100%);
  border:1.5px solid rgba(56,189,248,.2);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 48px rgba(56,189,248,.07),0 8px 32px rgba(0,0,0,.5);
}
.app-icon svg{width:52px;height:52px}

.app-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:3.25rem;font-weight:800;
  letter-spacing:-.01em;line-height:1;
  text-wrap:balance;
  margin-bottom:10px;color:#EEF4FF;
}
.app-name .accent{color:#38BDF8}

.tagline{
  font-size:.95rem;color:#4A5E72;
  font-weight:400;line-height:1.5;
  margin-bottom:28px;max-width:28ch;
}

.stats{
  display:flex;gap:6px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin-bottom:44px;
}
.chip{
  font-size:.72rem;font-weight:500;
  color:#3A5060;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:99px;padding:5px 11px;
  white-space:nowrap;letter-spacing:.01em;
}

.btn-group{display:flex;flex-direction:column;gap:12px;width:100%}

.store-btn{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;padding:18px 24px;border-radius:16px;
  text-decoration:none;font-family:'DM Sans',sans-serif;
  transition:transform .13s ease,box-shadow .13s ease;
  cursor:pointer;border:none;
}
.store-btn:hover{transform:translateY(-2px)}
.store-btn:active{transform:translateY(0)}
.store-btn:focus-visible{outline:2px solid #38BDF8;outline-offset:3px}

.btn-ios{
  background:#FFFFFF;color:#060C14;
  box-shadow:0 2px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);
}
.btn-ios:hover{box-shadow:0 6px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.12)}

.btn-android{
  background:#0A1620;color:#EEF4FF;
  border:1.5px solid rgba(255,255,255,.09);
  box-shadow:0 2px 24px rgba(0,0,0,.4);
}
.btn-android:hover{background:#0E1E2C;box-shadow:0 6px 32px rgba(0,0,0,.5)}

.btn-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn-sub{font-size:.68rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
.btn-main{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}

.footer{margin-top:44px;font-size:.72rem;color:#243040;line-height:1.6}
.footer a{color:#2E4050;text-decoration:none}
.footer a:hover{color:#4A6070}
.footer .dot{display:inline-block;margin:0 6px}

@media(prefers-reduced-motion:reduce){.store-btn{transition:none}}
</style>
</head>
<body>

<a href="/" class="back">← petransw.com</a>

  <div class="btn-group">

          <path d="M19.44 14.9c-.02-2.64 2.15-3.9 2.25-3.97-1.23-1.8-3.14-2.04-3.82-2.07-1.63-.17-3.18.97-4 .97-.83 0-2.12-.94-3.48-.92-1.79.03-3.44 1.05-4.36 2.66-1.86 3.23-.48 8.02 1.34 10.65.89 1.28 1.95 2.72 3.34 2.67 1.34-.05 1.85-.87 3.47-.87 1.61 0 2.07.87 3.49.84 1.44-.02 2.36-1.31 3.24-2.6 1.02-1.48 1.44-2.93 1.46-3.01-.03-.01-2.8-1.08-2.83-4.35zM17.01 6.8c.74-.9 1.24-2.15 1.1-3.39-1.06.04-2.34.71-3.1 1.6-.68.79-1.27 2.05-1.11 3.25 1.17.09 2.37-.6 3.11-1.46z" fill="#060C14"/>
        </svg>
      </div>
      <div class="btn-label">
        <span class="btn-sub">Download on the</span>
        <span class="btn-main">App Store</span>
      </div>
    </a>

    <a class="store-btn btn-android"
       href="https://play.google.com/store/apps/details?id=com.petransw.cricai"
       target="_blank" rel="noopener">
      <div class="btn-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 3.8L14.9 13 3 22.2V3.8z" fill="#38BDF8"/>
          <path d="M3 3.8l11.9 9.2-3.5 3.5L3 3.8z" fill="#22D3EE"/>

          <path d="M14.9 13l7.1-4.1-7.1 4.1z" fill="#F472B6"/>
          <path d="M14.9 13L22 8.9c.7.4 1.1 1.1 1.1 1.8v.6c0 .7-.4 1.4-1.1 1.8L14.9 13z" fill="#F472B6"/>
          <path d="M14.9 13l7.1 4.1c.7-.4 1.1-1.1 1.1-1.8v-.6c0-.7-.4-1.4-1.1-1.8L14.9 13z" fill="#818CF8"/>

      </div>
      <div class="btn-label">

  </div>

  <footer class="footer">
    <a href="https://petransw.com">petransw.com</a>

</div>
</body>
</html>
