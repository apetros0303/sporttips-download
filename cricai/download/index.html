<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricAI – Download</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HG6B5C7GJS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HG6B5C7GJS');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .sub  { color: #888; font-size: 0.95rem; margin-bottom: 40px; }

    /* The single matching-platform button shown as fallback */
    #smart-btn {
      display: none;
      width: 100%;
      max-width: 300px;
      padding: 16px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      margin: 0 auto 12px;
    }
    #smart-btn.ios     { background: #007aff; color: #fff; }
    #smart-btn.android { background: #3ddc84; color: #000; }

    /* Secondary buttons shown after smart-btn */
    .other-btns { display: none; margin-top: 8px; }
    .btn {
      display: block;
      width: 100%;
      max-width: 300px;
      padding: 13px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      margin: 6px auto;
      background: #222;
      color: #aaa;
    }

    #status { color: #555; font-size: 0.82rem; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="logo">🏏 CricAI</div>
  <div class="sub">AI-powered cricket predictions</div>

  <a id="smart-btn" href="#">Tap to download</a>

  <div class="other-btns" id="other-btns">
    <a class="btn" id="alt-btn" href="#">Other platform</a>
  </div>

  <div id="status">Detecting your device…</div>

  <script>
    var IOS_URL     = "https://apps.apple.com/gr/app/cricai/id6768100032";
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.petransw.cricai";

    var ua        = navigator.userAgent || "";
    var isIOS     = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var platform  = isIOS ? "ios" : isAndroid ? "android" : "web";
    var target    = isIOS ? IOS_URL : isAndroid ? ANDROID_URL : IOS_URL;

    var smartBtn  = document.getElementById("smart-btn");
    var otherBtns = document.getElementById("other-btns");
    var altBtn    = document.getElementById("alt-btn");
    var status    = document.getElementById("status");

    if (isIOS) {
      smartBtn.textContent = "Download on App Store";
      smartBtn.href = IOS_URL;
      smartBtn.className = "ios";
      altBtn.textContent = "Get it on Google Play";
      altBtn.href = ANDROID_URL;
    } else if (isAndroid) {
      smartBtn.textContent = "Get it on Google Play";
      smartBtn.href = ANDROID_URL;
      smartBtn.className = "android";
      altBtn.textContent = "Download on App Store";
      altBtn.href = IOS_URL;
    } else {
      // Desktop — show both options immediately
      smartBtn.textContent = "Download on App Store";
      smartBtn.href = IOS_URL;
      smartBtn.className = "ios";
      altBtn.textContent = "Get it on Google Play";
      altBtn.href = ANDROID_URL;
      showFallback("Choose your platform:");
    }

    function showFallback(msg) {
      smartBtn.style.display = "block";
      otherBtns.style.display = "block";
      status.textContent = msg || "";
      gtag('event', 'fallback_shown', { event_category: 'platform', event_label: platform });
    }

    // Attempt redirect via three methods
    var a = document.createElement('a');
    a.href = target;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

    window.location.href = target;
    window.location.replace(target);

    var fallbackTimer = setTimeout(function () {
      gtag('event', 'redirect', { event_category: 'platform', event_label: platform });
      var label = isIOS ? "App Store" : isAndroid ? "Google Play" : "";
      showFallback(label ? "Tap below to open " + label + ":" : "Choose your platform:");
    }, 600);

    window.addEventListener('beforeunload', function () {
      clearTimeout(fallbackTimer);
      gtag('event', 'redirect_success', { event_category: 'platform', event_label: platform });
    });
  </script>

</body>
</html>
