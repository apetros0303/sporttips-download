<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eras Daily</title>
<meta name="description" content="Your daily companion for the Eras — setlists, collectibles, and everything Taylor Swift. Free on iOS and Android.">
<link rel="canonical" href="https://petransw.com/erasdaily/">
<meta property="og:title" content="Eras Daily — Taylor Swift Fan App">
<meta property="og:description" content="Your daily companion for the Eras — setlists, collectibles, and everything Taylor Swift.">
<meta property="og:url" content="https://petransw.com/erasdaily/">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:#0A0810;
  color:#F5EEFF;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% -5%,rgba(244,114,182,.13) 0%,transparent 60%),
    radial-gradient(ellipse 60% 30% at 80% 90%,rgba(192,132,252,.08) 0%,transparent 50%);
  pointer-events:none;
  z-index:0;
}

.back{
  position:fixed;
  top:16px;left:20px;
  z-index:10;
  font-size:.8rem;
  color:#3A2A4A;
  text-decoration:none;
  transition:color .15s;
}
.back:hover{color:#604080}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.app-icon{
  width:96px;height:96px;
  border-radius:24px;
  background:linear-gradient(145deg,#1A0E26 0%,#120A1C 100%);
  border:1.5px solid rgba(244,114,182,.2);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 48px rgba(244,114,182,.08),0 8px 32px rgba(0,0,0,.5);
}
.app-icon svg{width:52px;height:52px}

.app-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:3.25rem;font-weight:800;
  letter-spacing:-.01em;line-height:1;
  text-wrap:balance;
  margin-bottom:10px;color:#F5EEFF;
}
.app-name .accent{color:#F472B6}

.tagline{
  font-size:.95rem;color:#5A4A6A;
  font-weight:400;line-height:1.5;
  margin-bottom:28px;max-width:28ch;
}

.stats{
  display:flex;gap:6px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin-bottom:44px;
}
.chip{
  font-size:.72rem;font-weight:500;
  color:#5A3A6A;
  background:rgba(244,114,182,.06);
  border:1px solid rgba(244,114,182,.12);
  border-radius:99px;padding:5px 11px;
  white-space:nowrap;letter-spacing:.01em;
}

.btn-group{display:flex;flex-direction:column;gap:12px;width:100%}

.store-btn{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;padding:18px 24px;border-radius:16px;
  text-decoration:none;font-family:'DM Sans',sans-serif;
  transition:transform .13s ease,box-shadow .13s ease;
  cursor:pointer;border:none;
}
.store-btn:hover{transform:translateY(-2px)}
.store-btn:active{transform:translateY(0)}
.store-btn:focus-visible{outline:2px solid #F472B6;outline-offset:3px}

.btn-ios{
  background:#FFFFFF;color:#0A0810;
  box-shadow:0 2px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);
}
.btn-ios:hover{box-shadow:0 6px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.12)}

.btn-android{
  background:#160E22;color:#F5EEFF;
  border:1.5px solid rgba(244,114,182,.12);
  box-shadow:0 2px 24px rgba(0,0,0,.4);
}
.btn-android:hover{background:#1C1230;box-shadow:0 6px 32px rgba(0,0,0,.5)}

.btn-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn-sub{font-size:.68rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
.btn-main{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}

.footer{margin-top:44px;font-size:.72rem;color:#2E1E40;line-height:1.6}
.footer a{color:#3E2A52;text-decoration:none}
.footer a:hover{color:#5A4070}
.footer .dot{display:inline-block;margin:0 6px}

@media(prefers-reduced-motion:reduce){.store-btn{transition:none}}
</style>
</head>
<body>

<a href="/" class="back">← petransw.com</a>

<div class="card">

  <div class="app-icon" aria-hidden="true">
    <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Sparkle / star core -->
      <circle cx="26" cy="26" r="22" fill="#120A1E" stroke="rgba(244,114,182,0.2)" stroke-width="1.5"/>
      <!-- Outer sparkle rays -->
      <path d="M26 6 L28 20 L26 26 L24 20 Z" fill="rgba(244,114,182,0.8)"/>
      <path d="M26 46 L28 32 L26 26 L24 32 Z" fill="rgba(244,114,182,0.3)"/>
      <path d="M6 26 L20 28 L26 26 L20 24 Z" fill="rgba(192,132,252,0.6)"/>
      <path d="M46 26 L32 28 L26 26 L32 24 Z" fill="rgba(192,132,252,0.6)"/>
      <!-- Diagonal sparkle rays -->
      <path d="M11.5 11.5 L22 22 L26 26 L22 22 Z" fill="rgba(244,114,182,0.5)" opacity="0.7"/>
      <path d="M40.5 11.5 L30 22 L26 26 L30 22 Z" fill="rgba(244,114,182,0.5)" opacity="0.7"/>
      <path d="M11.5 40.5 L22 30 L26 26 L22 30 Z" fill="rgba(192,132,252,0.4)" opacity="0.7"/>
      <path d="M40.5 40.5 L30 30 L26 26 L30 30 Z" fill="rgba(192,132,252,0.4)" opacity="0.7"/>
      <!-- Center glow -->
      <circle cx="26" cy="26" r="6" fill="rgba(244,114,182,0.7)"/>
      <circle cx="26" cy="26" r="3" fill="rgba(255,255,255,0.6)"/>
      <!-- Small accent stars -->
      <circle cx="16" cy="16" r="1.5" fill="rgba(244,114,182,0.5)"/>
      <circle cx="36" cy="16" r="1" fill="rgba(192,132,252,0.5)"/>
      <circle cx="16" cy="36" r="1" fill="rgba(192,132,252,0.4)"/>
      <circle cx="38" cy="36" r="1.5" fill="rgba(244,114,182,0.4)"/>
    </svg>
  </div>

  <h1 class="app-name">Eras <span class="accent">Daily</span></h1>
  <p class="tagline">Your daily companion through every era</p>

  <div class="stats">
    <span class="chip">All Eras</span>
    <span class="chip">Setlists</span>
    <span class="chip">Daily Content</span>
    <span class="chip">For Swifties</span>
  </div>

  <div class="btn-group">
    <a class="store-btn btn-android"
       href="https://play.google.com/store/apps/details?id=com.swiftdaily.app"
       target="_blank" rel="noopener">
      <div class="btn-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 3.8L14.9 13 3 22.2V3.8z" fill="#F472B6"/>
          <path d="M3 3.8l11.9 9.2-3.5 3.5L3 3.8z" fill="#E879F9"/>
          <path d="M3 22.2l8.4-8.7 3.5 3.5L3 22.2z" fill="#C084FC"/>
          <path d="M14.9 13l7.1-4.1-7.1 4.1z" fill="#F9A8D4"/>
          <path d="M14.9 13L22 8.9c.7.4 1.1 1.1 1.1 1.8v.6c0 .7-.4 1.4-1.1 1.8L14.9 13z" fill="#F9A8D4"/>
          <path d="M14.9 13l7.1 4.1c.7-.4 1.1-1.1 1.1-1.8v-.6c0-.7-.4-1.4-1.1-1.8L14.9 13z" fill="#C084FC"/>
        </svg>
      </div>
      <div class="btn-label">
        <span class="btn-sub">Get it on</span>
        <span class="btn-main">Google Play</span>
      </div>
    </a>
  </div>

  <p style="margin-top:18px;font-size:.75rem;color:#3A2A4A;letter-spacing:.02em">iOS version coming soon</p>

  <footer class="footer">
    <a href="https://petransw.com">petransw.com</a>
    <span class="dot">·</span>
    <a href="/privacy/erasdaily/">Privacy</a>
    <span class="dot">·</span>Free &amp; Premium
  </footer>

</div>
</body>
</html>
